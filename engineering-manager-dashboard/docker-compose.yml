services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emdb_user
      POSTGRES_PASSWORD: emdb_pass
      POSTGRES_DB: em_dashboard
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U emdb_user -d em_dashboard']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: emdb_user
      DATABASE_PASSWORD: emdb_pass
      DATABASE_NAME: em_dashboard
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEED_ON_START: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '4200:80'
    depends_on:
      - backend

volumes:
  postgres_data:
